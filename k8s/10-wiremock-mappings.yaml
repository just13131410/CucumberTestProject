# WireMock-Stub-Mappings für die APIs, die ZephyrScaleClient + JiraClient aufrufen.
# Wird nach /home/wiremock/mappings gemountet; WireMock lädt beim Start alle *.json.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wiremock-mappings
  namespace: test-automation
  labels:
    app: wiremock
data:
  # Kein Folder-Mock: ZephyrScaleService legt keine Folder mehr an. "folder" wird beim
  # Anlegen des Testruns als String-Pfad (zephyr.result-folder, z.B. "/Testautomation/Smoketest")
  # mitgegeben - der Pfad muss in Zephyr bereits existieren, siehe testrun.schema unter
  # https://support.smartbear.com/zephyr-scale-server/api-docs/v1/kanoah/testrun.schema.
  # GET /rest/atm/1.0/testrun/{key} → Template-Testrun mit Testfaellen (zum Klonen via "items")
  testrun-get.json: |
    {
      "request": { "method": "GET", "urlPathPattern": "/rest/atm/1.0/testrun/[^/]+" },
      "response": {
        "status": 200,
        "headers": { "Content-Type": "application/json" },
        "jsonBody": {
          "key": "QA-R1",
          "projectKey": "QA",
          "name": "Template Run",
          "items": [ { "testCaseKey": "QA-T1" }, { "testCaseKey": "QA-T2" } ]
        }
      }
    }
  # POST /rest/atm/1.0/testrun → angelegter Test-Cycle mit key + id
  testrun-post.json: |
    {
      "request": { "method": "POST", "urlPath": "/rest/atm/1.0/testrun" },
      "response": {
        "status": 201,
        "headers": { "Content-Type": "application/json" },
        "jsonBody": { "key": "QA-C1", "id": 9001, "name": "Mock Test Cycle" }
      }
    }
  # POST /rest/atm/1.0/testrun/{key}/testresults → Ergebnis-Upload akzeptiert
  testresults-post.json: |
    {
      "request": { "method": "POST", "urlPathPattern": "/rest/atm/1.0/testrun/[^/]+/testresults" },
      "response": {
        "status": 201,
        "headers": { "Content-Type": "application/json" },
        "jsonBody": [ { "id": 1, "testResultStatus": "Pass" } ]
      }
    }
  # POST /rest/api/2/issue → angelegtes Jira-Ticket
  jira-issue-post.json: |
    {
      "request": { "method": "POST", "urlPath": "/rest/api/2/issue" },
      "response": {
        "status": 201,
        "headers": { "Content-Type": "application/json" },
        "jsonBody": { "id": "10001", "key": "QA-1", "self": "http://wiremock:8080/rest/api/2/issue/10001" }
      }
    }
