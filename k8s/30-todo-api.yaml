# Allure Todo API (Node/Express, Port 3000) – Test-Fixture für die @API-Test-Szenarien.
# Quelle: F:/Dokumente/Dev/allure/api (eigenes Dockerfile). Image lokal bauen + in k3s importieren
# (siehe k8s/README.md, gleicher Weg wie die App). Zugang: admin/password123, user/user123.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: allure-todo-api
  namespace: test-automation
  labels:
    app: allure-todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: allure-todo-api
  template:
    metadata:
      labels:
        app: allure-todo-api
    spec:
      containers:
        - name: allure-todo-api
          image: allure-todo-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
            - name: JWT_SECRET
              value: "allure-demo-secret-key"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: allure-todo-api
  namespace: test-automation
  labels:
    app: allure-todo-api
spec:
  selector:
    app: allure-todo-api
  ports:
    - port: 3000
      targetPort: 3000
      name: http
