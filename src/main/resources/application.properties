# Spring Boot Application Configuration
spring.application.name=cucumber-test-service

# Active profile (override with SPRING_PROFILES_ACTIVE env var)
spring.profiles.active=dev

# Server Configuration
server.port=8080

# Actuator Configuration
management.server.port=8081
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
# Liveness/Readiness als eigene Health-Groups: Liveness = "JVM lebt" (nicht CPU-schwer),
# Readiness = "bereit für Traffic". K8s-Probes treffen /actuator/health/{liveness,readiness}
# statt des Aggregat-Endpoints, damit ein CPU-lastiger Testlauf keinen Liveness-Restart auslöst.
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Ausführungs-Steuerung (Backpressure + Speicherfestigkeit; siehe docs/lasttest-analyse-und-umsetzungsplan.md)
# max-concurrent-runs=1: In-Process-Ausführung teilt eine JVM -> >1 gleichzeitig sprengt Native-RAM
# (OOMKill) und korrumpiert Allure-Ergebnisse. Mit Subprozess-Isolation (mode=subprocess) erhöhbar.
test.execution.max-concurrent-runs=1
test.execution.max-queue-size=20
test.execution.status-retention-hours=24
test.execution.status-max-entries=500

# Logging
logging.level.org.example=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%15.15t] %-40.40logger{39} : %m%n

# Zephyr Scale Server/DC Integration
zephyr.enabled=false
zephyr.base-url=https://jira.yourcompany.com
zephyr.username=automation-user@company.com
zephyr.api-token=
zephyr.default-project-key=PROJ
# Key des Testruns, dessen Testfaelle in jeden neu angelegten Testrun geklont werden (z.B. PROJ-R1).
# Leer = neuer Testrun wird ohne vorbelegte Testfaelle angelegt.
zephyr.template-test-run-key=
# Zephyr-Folder-Pfad als String (kein numerisches Feld!), z.B. /Testautomation/Smoketest.
# Es wird kein Folder angelegt - der Pfad muss in Zephyr bereits existieren.
zephyr.result-folder=

# Jira Integration (shares base-url with Zephyr)
jira.enabled=false
jira.default-assignee-account-id=
jira.issue-type=Bug

# Mock-Modus: simuliert Zephyr/Jira-Responses ohne echte API-Calls
# true  → Links und Ticket-Keys werden generiert, aber kein externer Call
# false → Nur aktiv wenn zephyr.enabled oder jira.enabled = true
integration.mock.enabled=false
