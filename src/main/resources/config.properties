# Browser
# Wird nur genutzt, wenn playwright.mirror.enabled=false (externer Browser).
browser.executable.path=C:/Program Files/Google/Chrome/Application/chrome.exe

# Playwright Browser-Download über internen Mirror
# mirror.enabled=true  → Playwright-eigener Browser, per Mirror geladen (browser.executable.path wird ignoriert)
# mirror.enabled=false → externer Browser via browser.executable.path (Legacy-Verhalten)
playwright.mirror.enabled=true
# Basis-URL des Mirrors → wird als PLAYWRIGHT_DOWNLOAD_HOST an den Treiber übergeben.
# Env-Var-Form (OpenShift/Docker): PLAYWRIGHT_DOWNLOAD_HOST
playwright.download.host=http://playwright-mirror:10123
# Chromium-spezifischer Host (PLAYWRIGHT_CHROMIUM_DOWNLOAD_HOST). Leer = automatisch aus
# playwright.download.host + "/builds/cft" abgeleitet. Grund: Playwright hängt für Chromium
# nur <version>/<platform>/chrome-*.zip an; der Mirror liefert diese Chrome-for-Testing-
# Binaries unter /builds/cft/ aus (→ Google storage). Nur setzen, wenn der Mirror einen
# anderen Präfix nutzt.
playwright.chromium.download.host=
# Persistenter Browser-Cache (Reuse über Läufe hinweg). Leer = OS-Standard-Cache.
# Env-Var-Form (OpenShift/Docker): PLAYWRIGHT_BROWSERS_PATH
playwright.browsers.path=
# Browser bereits beim App-Start laden? Default false (Unit-Tests sollen nichts laden).
# In Prod/OpenShift und beim lokalen App-Start auf true setzen.
playwright.install.on-startup=false
# Welcher Browser beim Start geladen wird (überschreibbar per -Dbrowser).
playwright.browser=chromium
# Wo läuft der Browser? (Env: PLAYWRIGHT_MODE)
#   local  → App startet den Browser selbst (Mirror bzw. browser.executable.path, s.o.)
#   remote → App verbindet sich mit einem Playwright-Server (offizielles Node-Image,
#            `playwright run-server`, z.B. als Sidecar). Lokal wird nichts installiert/gestartet.
# Server- und Client-Version (npm/Maven playwright) müssen übereinstimmen.
playwright.mode=local
# WebSocket-Endpoint des Servers (nur bei mode=remote). Leer = ws://localhost:3000/ (Sidecar).
# Env: PLAYWRIGHT_REMOTE_ENDPOINT
playwright.remote.endpoint=
playwright.remote.connect-timeout-ms=30000
# Channel des Remote-Browsers (leer = Default/Headless-Shell). "chromium" = volles Chromium,
# nötig z.B. für --unsafely-treat-insecure-origin-as-secure. Env: PLAYWRIGHT_REMOTE_CHANNEL
playwright.remote.channel=

# Application URLs
baseUrl=http://localhost:4200/
apiURL=https://api.github.com
todoApiUrl=http://localhost:3000
# api.token wird ausschließlich über Secrets gesetzt (CONFIGPATH oder .env), nie hier eintragen

# Ziel-Umgebungen (Request-Feld "environment"). Env-Var-Form: TEST_ENVIRONMENTS
test.environments=dev,staging,prod,performance
# Umgebungsspezifische Werte: env.<umgebung>.<key> schlägt <key>, über dieselbe Quellen-Kette
# (Env-Var ENV_<UMGEBUNG>_<KEY>, -D, .env, CONFIGPATH, diese Datei). Ohne Eintrag gilt der globale Key.
#env.staging.baseUrl=https://staging.example.com/
#env.staging.todoApiUrl=https://todo.staging.example.com

# Zugangsdaten je System und Rolle: <system>.user.<rolle>.username/password
# Ausschließlich über .env (lokal) bzw. Vault/Secret (OpenShift) setzen, nie hier eintragen. Beispiele:
#   GUI_USER_ADMIN_USERNAME / GUI_USER_ADMIN_PASSWORD                         (global, z.B. dev)
#   TODO_USER_ADMIN_USERNAME / TODO_USER_ADMIN_PASSWORD
#   ENV_STAGING_GUI_USER_ADMIN_USERNAME / ENV_STAGING_GUI_USER_ADMIN_PASSWORD (nur Umgebung staging)

# PDF-Quelle für ApiSteps.
# Dev (leer): Datei liegt lokal im Projektordner, z.B. ./Response.pdf
# Prod:       HTTP-Basis-URL zum OpenShift-Server, wird durch PDF_BASE_URL Env-Var gesetzt.
#             Beispiel: https://cucumber-test-service-test-automation.apps-crc.testing/reports
pdf.base.url=

# Report Paths (dynamically set by TestContext, these are fallbacks)
# Dev: test-results (relative to project root)
# Prod: /app/test-results (container path via env var)
axe.reportPath=target/axe-result/
reportPath=target/reports/

# Zephyr Scale Integration (Optional)
# Diese Werte werden per Env-Var, .env-Datei oder System Property in Prod gesetzt.
# In Dev bleiben die Defaults in application-dev.properties aktiv (enabled=false).
#zephyr.base-url=https://jira.yourcompany.com
#zephyr.username=automation-user@company.com
#zephyr.api-token=
#zephyr.default-project-key=PROJ
# Key des Testruns, dessen Testfaelle geklont werden (z.B. PROJ-R1); leer = keine Testfaelle vorbelegt.
#zephyr.template-test-run-key=
# Zephyr-Folder-Pfad als String (muss bereits existieren), z.B. /Testautomation/Smoketest.
#zephyr.result-folder=

# Jira Integration (Optional)
#jira.default-assignee-account-id=
#jira.issue-type=Bug

# Timeouts für Zephyr/Jira-HTTP-Calls (ms), gelesen über ConfigReader.
# Env-Var-Form: INTEGRATION_HTTP_CONNECT_TIMEOUT_MS / INTEGRATION_HTTP_READ_TIMEOUT_MS. Ohne Timeout blockiert ein hängender Jira die Run-Queue.
integration.http.connect-timeout-ms=10000
integration.http.read-timeout-ms=60000
